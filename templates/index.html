<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Facial Expression Recognition</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  </head>
  <body class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <h1 class="text-center mb-4">Facial Expression Recognition</h1>
        <p class="text-center text-muted mb-4">
          Upload a photo of a face. Works best with a tightly cropped, front-facing face.
        </p>

        <form id="upload-form">
          <div class="mb-3">
            <label for="file" class="form-label">Choose an image</label>
            <input type="file" name="file" id="file" class="form-control" accept="image/*" required>
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-primary">Predict</button>
          </div>
        </form>

        <img id="preview" class="img-fluid rounded mx-auto mt-4" alt="Uploaded face" hidden>
        <h2 id="result" class="text-center h4 mt-4"></h2>
        <!-- One progress bar per emotion, filled in by the script below. -->
        <div id="probabilities" class="mt-3"></div>
      </div>
    </div>

    <script>
      const form = document.getElementById('upload-form');
      const fileInput = document.getElementById('file');
      const preview = document.getElementById('preview');
      const result = document.getElementById('result');
      const bars = document.getElementById('probabilities');

      // Preview the selected image.
      fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (!file) return;
        preview.src = URL.createObjectURL(file);
        preview.hidden = false;
      });

      // Render one labelled bar per emotion, highest probability first.
      function showProbabilities(probabilities) {
        bars.replaceChildren();
        Object.entries(probabilities)
          .sort(([, a], [, b]) => b - a)
          .forEach(([emotion, p]) => {
            const pct = (p * 100).toFixed(1);
            const label = document.createElement('div');
            label.className = 'small';
            label.textContent = `${emotion} ${pct}%`;
            const track = document.createElement('div');
            track.className = 'progress mb-2';
            const fill = document.createElement('div');
            fill.className = 'progress-bar';
            fill.style.width = `${pct}%`;
            track.appendChild(fill);
            bars.append(label, track);
          });
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        result.textContent = 'Analyzing...';
        bars.replaceChildren();
        try {
          const response = await fetch('/predict', { method: 'POST', body: new FormData(form) });
          const data = await response.json();
          if (!response.ok) {
            result.textContent = `Error: ${data.error}`;
            return;
          }
          result.textContent = `Prediction: ${data.result} (${(data.confidence * 100).toFixed(1)}%)`;
          showProbabilities(data.probabilities);
        } catch (error) {
          console.error(error);
          result.textContent = 'An error occurred while processing your request.';
        }
      });
    </script>
  </body>
</html>
